<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Weight edit versus retrain (illustrative)</title>
  <desc id="desc">Two paths from an observed model failure. The usual path retrains with an optimizer, then redeploys and evaluates. The weight-edit path inspects weights, applies a candidate targeted edit, then evaluates the edited model. Evaluation may show improvement or no material change. Illustrative of mechanism, not production deployment.</desc>

  <rect width="960" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Weight edit vs. retrain (illustrative)</text>
  <text x="480" y="50" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a5a">Mechanism shape from the article — not production deployment, and not a guarantee the edit helps</text>

  <!-- Shared start -->
  <rect x="28" y="178" width="136" height="68" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="96" y="206" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">Observed</text>
  <text x="96" y="225" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">model failure</text>

  <!-- Branch connector -->
  <path d="M164 200 H188 V112 H218" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
  <path d="M164 224 H188 V300 H218" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
  <polygon points="218,112 209,108 209,116" fill="#1a1a1a"/>
  <polygon points="218,300 209,296 209,304" fill="#1a1a1a"/>

  <!-- ===== USUAL FIX ===== -->
  <text x="218" y="82" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#5a5a5a" letter-spacing="0.06em">USUAL FIX</text>

  <rect x="218" y="90" width="156" height="50" rx="5" fill="#f3f4f6" stroke="#8b929a" stroke-width="1.15"/>
  <text x="296" y="110" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">Retrain</text>
  <text x="296" y="127" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a5a5a">optimizer · data · gradients</text>

  <line x1="374" y1="115" x2="404" y2="115" stroke="#1a1a1a" stroke-width="1.3"/>
  <polygon points="404,115 395,111 395,119" fill="#1a1a1a"/>

  <rect x="404" y="90" width="156" height="50" rx="5" fill="#f3f4f6" stroke="#8b929a" stroke-width="1.15"/>
  <text x="482" y="110" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">Redeploy</text>
  <text x="482" y="127" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a5a5a">full updated model</text>

  <line x1="560" y1="115" x2="590" y2="115" stroke="#1a1a1a" stroke-width="1.3"/>
  <polygon points="590,115 581,111 581,119" fill="#1a1a1a"/>

  <rect x="590" y="90" width="132" height="50" rx="5" fill="#f3f4f6" stroke="#8b929a" stroke-width="1.15"/>
  <text x="656" y="120" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">Evaluate</text>

  <!-- ===== WEIGHT-SPACE PATCH ===== -->
  <text x="218" y="256" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2f5f8a" letter-spacing="0.06em">WEIGHT-SPACE PATCH</text>

  <rect x="218" y="276" width="156" height="50" rx="5" fill="#eef4fb" stroke="#2f5f8a" stroke-width="1.35"/>
  <text x="296" y="296" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">Inspect / diagnose</text>
  <text x="296" y="313" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a5a5a">locate failure in weights</text>

  <line x1="374" y1="301" x2="404" y2="301" stroke="#1a1a1a" stroke-width="1.3"/>
  <polygon points="404,301 395,297 395,305" fill="#1a1a1a"/>

  <rect x="404" y="276" width="156" height="50" rx="5" fill="#eef4fb" stroke="#2f5f8a" stroke-width="1.35"/>
  <text x="482" y="296" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">Candidate weight edit</text>
  <text x="482" y="313" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a5a5a">targeted · no retraining</text>

  <line x1="560" y1="301" x2="590" y2="301" stroke="#1a1a1a" stroke-width="1.3"/>
  <polygon points="590,301 581,297 581,305" fill="#1a1a1a"/>

  <rect x="590" y="276" width="132" height="50" rx="5" fill="#eef4fb" stroke="#2f5f8a" stroke-width="1.35"/>
  <text x="656" y="296" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">Edited model</text>
  <text x="656" y="313" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a5a5a">weight delta applied</text>

  <line x1="722" y1="301" x2="752" y2="301" stroke="#1a1a1a" stroke-width="1.3"/>
  <polygon points="752,301 743,297 743,305" fill="#1a1a1a"/>

  <rect x="752" y="276" width="132" height="50" rx="5" fill="#eef4fb" stroke="#2f5f8a" stroke-width="1.35"/>
  <text x="818" y="306" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1a1a1a">Evaluate</text>

  <!-- Outcome fork under Evaluate -->
  <path d="M818 326 V348" fill="none" stroke="#1a1a1a" stroke-width="1.15"/>
  <path d="M760 348 H876" fill="none" stroke="#1a1a1a" stroke-width="1.15"/>
  <line x1="760" y1="348" x2="760" y2="362" stroke="#2f6b4f" stroke-width="1.2"/>
  <line x1="876" y1="348" x2="876" y2="362" stroke="#6b7280" stroke-width="1.2"/>

  <text x="760" y="378" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2f6b4f">may improve</text>
  <text x="760" y="393" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5a5a5a">e.g. Qwen loop edit</text>

  <text x="876" y="378" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#6b7280">or not</text>
  <text x="876" y="393" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5a5a5a">e.g. Gemma case</text>

  <!-- Footnote -->
  <text x="28" y="424" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#5a5a5a">Source shape: Takehi et al., Sparks of Weight-Space Programming (MIT CSAIL). Retrain is the usual baseline; the lower path is a targeted weight edit without retraining. Outcomes are empirical.</text>
</svg>
